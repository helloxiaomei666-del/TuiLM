<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>手机预览 - 退了吗</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #eef4f1;
        --ink: #17201c;
        --muted: #66746e;
        --line: #d8e3de;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--ink);
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          "Microsoft YaHei", sans-serif;
      }

      .preview-shell {
        width: min(100vw - 24px, 430px);
        padding: 16px;
      }

      .preview-title {
        margin-bottom: 12px;
      }

      .preview-title h1 {
        margin: 0 0 4px;
        font-size: 1rem;
      }

      .preview-title p {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .phone {
        overflow: hidden;
        width: min(100%, 393px);
        height: min(82vh, 852px);
        margin: 0 auto;
        border: 10px solid #111815;
        border-radius: 34px;
        background: #ffffff;
        box-shadow: 0 24px 80px rgba(16, 24, 40, 0.24);
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main class="preview-shell">
      <div class="preview-title">
        <h1>手机端示意</h1>
        <p>这是 393px 宽的手机预览框，内部加载当前 Demo。</p>
      </div>
      <div class="phone">
        <iframe src="index.html?preview=phone&v=20260608-tabs2" title="退了吗手机端预览"></iframe>
      </div>
    </main>
  </body>
</html>
